[package]
name = "genrmsg"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "^4.5", features = ["derive"] }
serde = { version = "^1.0", features = ["derive"] }
serde_yaml = "^0.9"
env_logger = "0.11.8"
log = "0.4"

[dev-dependencies]
clap = "4.5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true


