settings:
  output_file: spec06.rs.txt
  module_doc: Test message defintion
  serialization_framework: bincode
common_structs:
  SimulationResult:
    description: Simulation result data structure
    fields:
      num_iterations:
        type: i64
        description: Number of iterations in the simulation
      proj_id:
        type: i64
        description: Project identifier
      percentiles:
        type: '[i64; 20]'
        description: Stores p99, p95, ... p5
      task_distribution:
        type: TaskDistribution
        description: Type of distribution used
      sim_id:
        type: i64
        description: Unique identifier for the simulation
      created_at:
        type: DateTime<Utc>
        description: Timestamp when simulation was created
      proj_revision:
        type: i64
        description: Project revision at simulation time
  ProjectData:
    description: Project data structure used in project listings
    fields:
      project_id:
        type: i64
        description: Unique identifier for the project
      num_tasks:
        type: i64
        description: Number of tasks in the project
      project_start_date:
        type: NaiveDate
        description: Project start date
      project_name:
        type: String
        description: Name of the project
      revision:
        type: i64
        description: Project revision number
  TaskData:
    description: Task data structure used in various messages
    fields:
      revision:
        type: Option<i64>
        description: Task revision number
      nominal_effort:
        type: i64
        description: Nominal effort estimate
      task_name:
        type: String
        description: Name of the task
      task_id:
        type: Option<i64>
        description: Unique identifier for the task
      description:
        type: String
        description: Task description
      low_effort:
        type: i64
        description: Low effort estimate
      high_effort:
        type: i64
        description: High effort estimate
enums:
  ImportFormat:
    description: Format for importing project data
    variants:
    - yaml
    - csv
    - json
    implement_traits:
    - Display
    - FromStr
  TaskDistribution:
    description: Distribution used for task effort simulation
    variants:
    - Triangle
    - Beta
    - Uniform
    implement_traits:
    - Display
    - FromStr
  ExportFormat:
    description: Format for exporting project data
    variants:
    - yaml
    - csv
    - json
    implement_traits:
    - Display
    - FromStr
error_message:
  description: Generic error message for all possible errors
  fields:
    error_message:
      type: String
      description: Human-readable error message
    error_id:
      type: u32
      description: Unique error identifier
messages:
- category: Project Management
  messages:
  - name: NewProj
    description: Create a new project
    number: 1
    request:
      fields:
        project_name:
          type: String
          description: Name of the project
        project_start_date:
          type: NaiveDate
          description: Project start date
    response:
      fields:
        project_name:
          type: String
          description: Name of the project
        project_start_date:
          type: NaiveDate
          description: Project start date
        project_id:
          type: i64
          description: Unique identifier for the new project
  - name: DelProj
    description: Delete existing project and its simulations
    number: 5
    request:
      fields:
        project_id:
          type: i64
          description: Project identifier to delete
    response:
      fields:
        project_id:
          type: i64
          description: Project identifier that was deleted
  - name: GetProj
    description: Get project base data
    number: 6
    request:
      fields:
        project_id:
          type: i64
          description: Project identifier to retrieve
    response:
      fields:
        num_tasks:
          type: i64
          description: Number of tasks in the project
        project_id:
          type: i64
          description: Project identifier
        project_name:
          type: String
          description: Name of the project
        revision:
          type: i64
          description: Project revision number
        project_start_date:
          type: NaiveDate
          description: Project start date
  - name: DelAllProj
    description: Delete all stored projects and simulations
    number: 11
    request:
      fields: {}
    response:
      fields:
        placeholder:
          type: i64
          description: Placeholder value
  - name: GetAllProjs
    description: Get all projects
    number: 17
    request:
      fields: {}
    response:
      fields:
        num_projs:
          type: i64
          description: Number of projects
        projects:
          type: Vec<ProjectData>
          description: List of projects
  - name: EditProj
    description: Edit an existing project
    number: 19
    request:
      fields:
        project_start_date:
          type: NaiveDate
          description: New project start date
        project_id:
          type: i64
          description: Project identifier to edit
        project_name:
          type: String
          description: New name for the project
    response:
      fields:
        num_tasks:
          type: i64
          description: Number of tasks in the project
        project_id:
          type: i64
          description: Project identifier
        project_name:
          type: String
          description: Updated project name
        revision:
          type: i64
          description: New project revision number
        project_start_date:
          type: NaiveDate
          description: Updated project start date
- category: Task Management
  messages:
  - name: AddTask
    description: Add task to existing project
    number: 2
    request:
      fields:
        high_effort:
          type: i64
          description: High effort estimate
        task_name:
          type: String
          description: Name of the task
        nominal_effort:
          type: i64
          description: Nominal effort estimate
        project_id:
          type: i64
          description: Project identifier
        low_effort:
          type: i64
          description: Low effort estimate
        description:
          type: String
          description: Task description
    response:
      fields:
        high_effort:
          type: i64
          description: High effort estimate
        project_id:
          type: i64
          description: Project identifier
        task_id:
          type: i64
          description: Unique identifier for the new task
        task_name:
          type: String
          description: Name of the task
        description:
          type: String
          description: Task description
        low_effort:
          type: i64
          description: Low effort estimate
        nominal_effort:
          type: i64
          description: Nominal effort estimate
  - name: EditTask
    description: Edit existing task
    number: 3
    request:
      fields:
        low_effort:
          type: i64
          description: Low effort estimate
        description:
          type: String
          description: Task description
        task_id:
          type: i64
          description: Task identifier to edit
        task_name:
          type: String
          description: Name of the task
        nominal_effort:
          type: i64
          description: Nominal effort estimate
        project_id:
          type: i64
          description: Project identifier
        high_effort:
          type: i64
          description: High effort estimate
    response:
      fields:
        low_effort:
          type: i64
          description: Low effort estimate
        task_name:
          type: String
          description: Name of the task
        task_id:
          type: i64
          description: Task identifier
        description:
          type: String
          description: Task description
        project_id:
          type: i64
          description: Project identifier
        nominal_effort:
          type: i64
          description: Nominal effort estimate
        high_effort:
          type: i64
          description: High effort estimate
  - name: DelTask
    description: Delete existing task
    number: 4
    request:
      fields:
        project_id:
          type: i64
          description: Project identifier
        task_id:
          type: i64
          description: Task identifier to delete
    response:
      fields:
        task_id:
          type: i64
          description: Task identifier that was deleted
        project_id:
          type: i64
          description: Project identifier
  - name: GetTask
    description: Get task data
    number: 7
    request:
      fields:
        task_id:
          type: i64
          description: Task identifier to retrieve
        project_id:
          type: i64
          description: Project identifier
    response:
      fields:
        description:
          type: String
          description: Task description
        project_id:
          type: i64
          description: Project identifier
        task_name:
          type: String
          description: Name of the task
        low_effort:
          type: i64
          description: Low effort estimate
        high_effort:
          type: i64
          description: High effort estimate
        task_id:
          type: i64
          description: Task identifier
        nominal_effort:
          type: i64
          description: Nominal effort estimate
        revision:
          type: i64
          description: Task revision number
  - name: GetAllTasks
    description: Get all tasks for a given project
    number: 8
    request:
      fields:
        project_id:
          type: i64
          description: Project identifier
    response:
      fields:
        num_tasks:
          type: i64
          description: Number of tasks in the project
        tasks:
          type: Vec<TaskData>
          description: List of tasks in the project
- category: Simulation Management
  messages:
  - name: DelSimulation
    description: Delete all stored simulations for a given project
    number: 9
    request:
      fields:
        project_id:
          type: i64
          description: Project identifier
    response:
      fields:
        project_id:
          type: i64
          description: Project identifier
  - name: DelAllSimulations
    description: Delete all stored simulations
    number: 10
    request:
      fields: {}
    response:
      fields:
        placeholder:
          type: i64
          description: Placeholder value
  - name: GetSim
    description: Get simulation data by ID
    number: 21
    request:
      fields:
        sim_id:
          type: i64
          description: Simulation identifier
    response:
      fields:
        sim_id:
          type: i64
          description: Simulation identifier
        simulation:
          type: Option<SimulationResult>
          description: The simulation result, if found
  - name: LastSim
    description: Get last simulation for project
    number: 13
    request:
      fields:
        project_id:
          type: i64
          description: Project identifier
    response:
      fields:
        project_id:
          type: i64
          description: Project identifier
        simulation:
          type: Option<SimulationResult>
          description: The last simulation result, if any
  - name: GetAllProjectSimulations
    description: Get all simulations for a given project
    number: 18
    request:
      fields:
        project_id:
          type: i64
          description: Project identifier
    response:
      fields:
        simulations:
          type: Vec<SimulationResult>
          description: List of simulation results
        num_sims:
          type: i64
          description: Number of simulations
- category: Configuration
  messages:
  - name: GetConfig
    description: Get simulation configuration
    number: 14
    request:
      fields: {}
    response:
      fields:
        num_iterations:
          type: i64
          description: Number of iterations for simulation
        task_distribution:
          type: TaskDistribution
          description: Distribution used for task effort
  - name: SetConfig
    description: Set simulation configuration
    number: 15
    request:
      fields:
        task_distribution:
          type: TaskDistribution
          description: Distribution used for task effort
        num_iterations:
          type: i64
          description: Number of iterations for simulation
    response:
      fields:
        task_distribution:
          type: TaskDistribution
          description: Distribution used for task effort
        num_iterations:
          type: i64
          description: Number of iterations for simulation
- category: Import/Export
  messages:
  - name: Export
    description: Export a project to YAML or CSV
    number: 12
    request:
      fields:
        project_id:
          type: i64
          description: Project identifier to export
        export_format:
          type: ExportFormat
          description: Format to export (yaml, csv, json)
    response:
      fields:
        export_format:
          type: ExportFormat
          description: Format of export
        exported_data:
          type: String
          description: Exported project data
        project_id:
          type: i64
          description: Project identifier
  - name: Import
    description: Import a project from a YAML or CSV file
    number: 16
    request:
      fields:
        import_data:
          type: String
          description: Project data to import
        import_format:
          type: ImportFormat
          description: Format to import (yaml, csv, json)
    response:
      fields:
        import_format:
          type: ImportFormat
          description: Format of import
        project_id:
          type: i64
          description: ID of the newly created project
- category: Simulation Execution
  messages:
  - name: Simulate
    description: Run a simulation for a given project
    number: 20
    request:
      fields:
        project_id:
          type: i64
          description: Project identifier to simulate
    response:
      fields:
        sim_id:
          type: i64
          description: ID of the created simulation
  - name: StoreSimulation
    description: Store simulation results
    number: 22
    request:
      fields:
        project_id:
          type: i64
          description: Project identifier
        project_revision:
          type: i64
          description: Project revision at simulation time
        task_distribution:
          type: TaskDistribution
          description: Distribution used for task effort
        num_iterations:
          type: i64
          description: Number of iterations in the simulation
        percentiles:
          type: '[i64; 20]'
          description: Stores p99, p95, ... p5
    response:
      fields:
        sim_id:
          type: i64
          description: ID of the stored simulation
