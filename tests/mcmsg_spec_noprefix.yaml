# Global settings
settings:
  output_file: "./msg_lib.rs"
  module_doc: "Test message defintion"
  serialization_framework: "bincode"

# Common structures used across multiple messages
common_structs:
  TaskData:
    description: "Task data structure used in various messages"
    fields:
      task_id: 
        type: "Option<i64>"
        description: "Unique identifier for the task"
      task_name: 
        type: "String"
        description: "Name of the task"
      description: 
        type: "String"
        description: "Task description"
      low_effort: 
        type: "i64"
        description: "Low effort estimate"
      nominal_effort: 
        type: "i64"
        description: "Nominal effort estimate"
      high_effort: 
        type: "i64"
        description: "High effort estimate"
      revision: 
        type: "Option<i64>"
        description: "Task revision number"

  ProjectData:
    description: "Project data structure used in project listings"
    fields:
      project_id:
        type: "i64"
        description: "Unique identifier for the project"
      project_name:
        type: "String"
        description: "Name of the project"
      project_start_date:
        type: "NaiveDate"
        description: "Project start date"
      num_tasks:
        type: "i64"
        description: "Number of tasks in the project"
      revision:
        type: "i64"
        description: "Project revision number"

  SimulationResult:
    description: "Simulation result data structure"
    fields:
      sim_id:
        type: "i64"
        description: "Unique identifier for the simulation"
      proj_id:
        type: "i64"
        description: "Project identifier"
      proj_revision:
        type: "i64"
        description: "Project revision at simulation time"
      num_iterations:
        type: "i64"
        description: "Number of iterations in the simulation"
      task_distribution:
        type: "TaskDistribution"
        description: "Type of distribution used"
      created_at:
        type: "DateTime<Utc>"
        description: "Timestamp when simulation was created"
      percentiles:
        type: "[i64; 20]"
        description: "Stores p99, p95, ... p5"

# Enums used in various messages
enums:
  TaskDistribution:
    description: "Distribution used for task effort simulation"
    variants:
      - Triangle
      - Beta
      - Uniform
    implement_traits:
      - Display
      - FromStr

  ImportFormat:
    description: "Format for importing project data"
    variants:
      - yaml
      - csv
      - json
    implement_traits:
      - Display
      - FromStr

  ExportFormat:
    description: "Format for exporting project data"
    variants:
      - yaml
      - csv
      - json
    implement_traits:
      - Display
      - FromStr

# Error message definition
error_message:
  name: "M900_Error"
  description: "Generic error message for all possible errors"
  fields:
    error_id:
      type: "u32"
      description: "Unique error identifier"
    error_message:
      type: "String"
      description: "Human-readable error message"

# Message definitions grouped by category
messages:
  - category: "Project Management"
    messages:
      - name: "NewProj"
        description: "Create a new project"
        request:
          fields:
            project_name:
              type: "String"
              description: "Name of the project"
            project_start_date:
              type: "NaiveDate"
              description: "Project start date"
        response:
          fields:
            project_name:
              type: "String"
              description: "Name of the project"
            project_start_date:
              type: "NaiveDate"
              description: "Project start date"
            project_id:
              type: "i64"
              description: "Unique identifier for the new project"

      - name: "DelProj"
        description: "Delete existing project and its simulations"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier to delete"
        response:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier that was deleted"

      - name: "GetProj"
        description: "Get project base data"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier to retrieve"
        response:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            project_name:
              type: "String"
              description: "Name of the project"
            project_start_date:
              type: "NaiveDate"
              description: "Project start date"
            num_tasks:
              type: "i64"
              description: "Number of tasks in the project"
            revision:
              type: "i64"
              description: "Project revision number"

      - name: "DelAllProj"
        description: "Delete all stored projects and simulations"
        request:
          fields: {}  # Empty payload
        response:
          fields:
            placeholder:
              type: "i64"
              description: "Placeholder value"

      - name: "GetAllProjs"
        description: "Get all projects"
        request:
          fields: {}  # Empty payload
        response:
          fields:
            num_projs:
              type: "i64"
              description: "Number of projects"
            projects:
              type: "Vec<ProjectData>"
              description: "List of projects"
              
      - name: "EditProj"
        description: "Edit an existing project"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier to edit"
            project_name:
              type: "String"
              description: "New name for the project" 
            project_start_date:
              type: "NaiveDate"
              description: "New project start date"
        response:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            project_name:
              type: "String"
              description: "Updated project name"
            project_start_date:
              type: "NaiveDate"
              description: "Updated project start date"
            num_tasks:
              type: "i64"
              description: "Number of tasks in the project"
            revision:
              type: "i64"
              description: "New project revision number"

  - category: "Task Management"
    messages:
      - name: "AddTask"
        description: "Add task to existing project"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            task_name:
              type: "String"
              description: "Name of the task"
            description:
              type: "String"
              description: "Task description"
            low_effort:
              type: "i64"
              description: "Low effort estimate"
            nominal_effort:
              type: "i64"
              description: "Nominal effort estimate"
            high_effort:
              type: "i64"
              description: "High effort estimate"
        response:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            task_name:
              type: "String"
              description: "Name of the task"
            description:
              type: "String"
              description: "Task description"
            low_effort:
              type: "i64"
              description: "Low effort estimate"
            nominal_effort:
              type: "i64"
              description: "Nominal effort estimate"
            high_effort:
              type: "i64"
              description: "High effort estimate"
            task_id:
              type: "i64"
              description: "Unique identifier for the new task"
              
      - name: "EditTask"
        description: "Edit existing task"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            task_id:
              type: "i64"
              description: "Task identifier to edit"
            task_name:
              type: "String"
              description: "Name of the task"
            description:
              type: "String"
              description: "Task description"
            low_effort:
              type: "i64"
              description: "Low effort estimate"
            nominal_effort:
              type: "i64"
              description: "Nominal effort estimate"
            high_effort:
              type: "i64"
              description: "High effort estimate"
        response:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            task_id:
              type: "i64"
              description: "Task identifier"
            task_name:
              type: "String"
              description: "Name of the task"
            description:
              type: "String"
              description: "Task description"
            low_effort:
              type: "i64"
              description: "Low effort estimate"
            nominal_effort:
              type: "i64"
              description: "Nominal effort estimate"
            high_effort:
              type: "i64"
              description: "High effort estimate"
              
      - name: "DelTask"
        description: "Delete existing task"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            task_id:
              type: "i64"
              description: "Task identifier to delete"
        response:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            task_id:
              type: "i64"
              description: "Task identifier that was deleted"
              
      - name: "GetTask"
        description: "Get task data"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            task_id:
              type: "i64"
              description: "Task identifier to retrieve"
        response:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            task_id:
              type: "i64"
              description: "Task identifier"
            task_name:
              type: "String"
              description: "Name of the task"
            description:
              type: "String"
              description: "Task description"
            low_effort:
              type: "i64"
              description: "Low effort estimate"
            nominal_effort:
              type: "i64"
              description: "Nominal effort estimate"
            high_effort:
              type: "i64"
              description: "High effort estimate"
            revision:
              type: "i64"
              description: "Task revision number"
              
      - name: "GetAllTasks"
        description: "Get all tasks for a given project"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
        response:
          fields:
            num_tasks:
              type: "i64"
              description: "Number of tasks in the project"
            tasks:
              type: "Vec<TaskData>"
              description: "List of tasks in the project"

  - category: "Simulation Management"
    messages:
      - name: "DelSimulation"
        description: "Delete all stored simulations for a given project"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
        response:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
              
      - name: "DelAllSimulations"
        description: "Delete all stored simulations"
        request:
          fields: {}  # Empty payload
        response:
          fields:
            placeholder:
              type: "i64"
              description: "Placeholder value"
              
      - name: "GetSim"
        description: "Get simulation data by ID"
        request:
          fields:
            sim_id:
              type: "i64"
              description: "Simulation identifier"
        response:
          fields:
            sim_id:
              type: "i64"
              description: "Simulation identifier"
            simulation:
              type: "Option<SimulationResult>"
              description: "The simulation result, if found"
              
      - name: "LastSim"
        description: "Get last simulation for project"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
        response:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            simulation:
              type: "Option<SimulationResult>"
              description: "The last simulation result, if any"
              
      - name: "GetAllProjectSimulations"
        description: "Get all simulations for a given project"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
        response:
          fields:
            num_sims:
              type: "i64"
              description: "Number of simulations"
            simulations:
              type: "Vec<SimulationResult>"
              description: "List of simulation results"

  - category: "Configuration"
    messages:
      - name: "GetConfig"
        description: "Get simulation configuration"
        request:
          fields: {}  # Empty payload
        response:
          fields:
            num_iterations:
              type: "i64"
              description: "Number of iterations for simulation"
            task_distribution:
              type: "TaskDistribution"
              description: "Distribution used for task effort"
              
      - name: "SetConfig"
        description: "Set simulation configuration"
        request:
          fields:
            num_iterations:
              type: "i64"
              description: "Number of iterations for simulation"
            task_distribution:
              type: "TaskDistribution"
              description: "Distribution used for task effort"
        response:
          fields:
            num_iterations:
              type: "i64"
              description: "Number of iterations for simulation"
            task_distribution:
              type: "TaskDistribution"
              description: "Distribution used for task effort"

  - category: "Import/Export"
    messages:
      - name: "Export"
        description: "Export a project to YAML or CSV"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier to export"
            export_format:
              type: "ExportFormat"
              description: "Format to export (yaml, csv, json)"
        response:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            export_format:
              type: "ExportFormat"
              description: "Format of export"
            exported_data:
              type: "String"
              description: "Exported project data"
              
      - name: "Import"
        description: "Import a project from a YAML or CSV file"
        request:
          fields:
            import_format:
              type: "ImportFormat"
              description: "Format to import (yaml, csv, json)"
            import_data:
              type: "String"
              description: "Project data to import"
        response:
          fields:
            import_format:
              type: "ImportFormat"
              description: "Format of import"
            project_id:
              type: "i64"
              description: "ID of the newly created project"

  - category: "Simulation Execution"
    messages:
      - name: "Simulate"
        description: "Run a simulation for a given project"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier to simulate"
        response:
          fields:
            sim_id:
              type: "i64"
              description: "ID of the created simulation"
              
      - name: "StoreSimulation"
        description: "Store simulation results"
        request:
          fields:
            project_id:
              type: "i64"
              description: "Project identifier"
            project_revision:
              type: "i64"
              description: "Project revision at simulation time"
            task_distribution:
              type: "TaskDistribution"
              description: "Distribution used for task effort"
            num_iterations:
              type: "i64"
              description: "Number of iterations in the simulation"
            percentiles:
              type: "[i64; 20]"
              description: "Stores p99, p95, ... p5"
        response:
          fields:
            sim_id:
              type: "i64" 
              description: "ID of the stored simulation"
